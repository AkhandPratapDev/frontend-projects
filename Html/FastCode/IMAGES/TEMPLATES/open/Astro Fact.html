<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST Code - Astro Fact</title>
    <style>
        :root{
            --btn-clr: linear-gradient(45deg,#2bfdea,#ff3bf8);
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            text-decoration: none;
            list-style: none;
        }

        .hero{
            min-height: 100vh;
            background: url(./images/astrofact_back.jpg);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        nav{
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 98%;
            margin: auto;
            padding: 10px 0;
            border-bottom: 2px solid #fff;
        }

        .logo{
            width: 230px;
        }

        nav ul{
            display: flex;
            align-items: center;
        }
        nav ul li{
            margin: 0 20px;
        }

        nav ul li a{
            font-size: 15px;
            color: #fff;
            text-transform: uppercase;
        }
        nav ul li a:hover{
            color: #2bfdea;
            border-bottom: 2px solid #2bfdea;
        }

        nav button{
            padding: 12px 35px;
            background: var(--btn-clr);
            border: none;
            color: #fff;
            border-radius: 2rem;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }
        nav button:hover{
            scale: .8;
            box-shadow: 0 0 20px #ff3bf8;
        }

        .content{
            position: absolute;
            top: 35%;
            left: 90px;
        }

        h2{
            font-size: 52px;
            color: #fff;
            font-weight: 800;
            text-transform: uppercase;
        }

        h2 span{
            background: var(--btn-clr);
            -webkit-text-fill-color: transparent;
            -webkit-background-clip: text;
        }

        p{
            color: #fff;
            font-size: 11px;
            margin-top: 10px;
        }

        .content button{
            margin-top: 50px;
            padding: 12px 45px;
            background: var(--btn-clr);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            transition: .3s;
        }
        .content button:hover{
            scale: .8;
        }
        .content button.know_more{
            border: 2px solid #2bfdea;
            color: #2bfdea;
            background: transparent;
            margin-left: 25px;
        }

        .content button.know_more:hover{
            scale: 1;
            box-shadow: 0 0 25px #2bfdea;
        }
    </style>
</head>
<body>
    <div class="hero">
        <nav>
            <img src="./images/astrofact_logo.png"  class="logo">

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Facts</a></li>
                <li><a href="#">Blogs</a></li>
                <li><a href="#">Reviews</a></li>
            </ul>

            <Button>More</Button>
        </nav>

        <div class="content"> 
            <h2>Exploring the <br> Universe, One <span>Fact</span> </h2>
            <p>Explore the cosmos with facts that shine! Discover celestial wonder and unravel the <br> mysteries of the universe on our Astro Fact website.</p>

            <button>Learn Now</button>
            <button class="know_more">Know More</button>
        </div>
    </div>
</body>
</html>

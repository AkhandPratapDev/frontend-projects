<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST Code - TShirt</title>
    <style>
        :root{
            --btn-clr: linear-gradient(45deg, #4dc7dd, #99c6c7, #feacb3);
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            text-decoration: none;
            list-style: none;
        }

        .hero{
            min-height: 100vh;
            background: url(./images/shirt_back.jpg);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        nav{
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 98%;
            margin: auto;
            padding: 10px 0;
            border-bottom: 2px solid #fff;
        }

        .logo{
            width: 160px;
        }

        nav ul{
            display: flex;
            align-items: center;
        }

        nav ul li{
            margin: 0 20px;
        }

        nav ul li a{
            font-size: 15px;
            color: #fff;
            text-transform: uppercase;
        }
        nav ul li a:hover{
            border-bottom: 2px solid #fff;
        }

        nav button{
            padding: 12px 35px;
            background: var(--btn-clr);
            border: none;
            border-radius: 2rem;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: .3s;
        }

        nav button:hover{
            scale: .8;
        }

        .content{
            position: absolute;
            top: 35%;
            left: 90px;
        }

        h2{
            font-size: 52px;
            color: #fff;
            font-weight: 800;
            text-transform: uppercase;
        }
        h2 span{
            background: var(--btn-clr);
            -webkit-text-fill-color: transparent;
            -webkit-background-clip: text;
        }
        p{
            color: #fff;
            font-size: 11px;
            margin-top: 10px;
        }

        .content button{
            margin-top: 50px;
            padding: 12px 45px;
            border: none;
            border-radius: 2rem;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            background: var(--btn-clr);
            transition: .3s;
        }

        .content button:hover{
            scale: .8;
        }
        .content button.know_more{
            margin-left: 25px;
            border: 2px solid #fff;
            background: transparent;
        }

        .content button.know_more:hover{
            background: var(--btn-clr);
            border: none;
        }
    </style>
</head>
<body>
    <div class="hero">
        <nav>
            <img src="./images/shirt_logo.png"  class="logo">

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Stores</a></li>
                <li><a href="#">Reviews</a></li>
            </ul>

            <button>More</button>
        </nav>

        <div class="content">
            <h2>Elevate your looks <br> with style & <span>comfort</span> </h2>
            <p>Simplicity is Sophistication. Effortless style. Step into world  where style meets comfort,and timeless design, because you deserve the best. </p>

            <button>Order Now</button>
            <button class="know_more">Know More</button>
        </div>
    </div>
</body>
</html>
